name: Code Quality Diagnostics

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    name: PHP ${{ matrix.php }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            output: '-o github-action -o default'
            phpcq_install: 'update'
          - php: '8.4'
            output: '-o github-action -o default'
            phpcq_install: 'update'
          - php: '8.5'
            output: '-o github-action -o default'
            phpcq_install: 'update'

    steps:
      - name: Pull source
        uses: actions/checkout@v7

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      # Caches are restored where their step runs, so they have to come before the steps that fill them.
      - name: Cache vendor directory
        uses: actions/cache@v6
        env:
          cache-name: vendor-${{ matrix.php }}
        with:
          path: vendor
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      # Holds the installed plugins and tools, their installed.json and the GnuPG keyring of the trusted keys.
      # The build output and the local repository are recreated on each run and must not be restored.
      - name: Cache phpcq directory
        uses: actions/cache@v6
        env:
          cache-name: phpcq-${{ matrix.php }}
        with:
          path: |
            .phpcq
            !.phpcq/build
            !.phpcq/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('.phpcq.lock', '.phpcq.yaml.dist') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      # Also builds the local phpcq repository, see bin/build-local-repository.php.
      - name: Install composer dependencies
        run: composer install

      # Reinstalls the local plugin if its checksum differs from the restored installation.
      - name: Install phpcq toolchain
        run: ./vendor/bin/phpcq ${{ matrix.phpcq_install }} -v

      - name: Run tests
        run: ./vendor/bin/phpcq run -v ${{ matrix.output }}

      - name: Upload build directory to artifact
        uses: actions/upload-artifact@v7
        if: ${{ success() || failure() }}
        with:
          name: phpcq-builds-php-${{ matrix.php }}
          path: .phpcq/build/
